name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-jvm:
    name: Tests et build JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify

  build-native:
    name: Build natif (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-jvm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify -Dnative -Dquarkus.native.container-build=true -DskipTests
