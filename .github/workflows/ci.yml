name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-jvm:
    name: Tests et build JVM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verifier la copie du contrat (sha256)
        run: |
          expected="$(sed -n 's/^sha256=//p' src/main/openapi/CONTRACT_VERSION)"
          actual="$(sha256sum src/main/openapi/openapi.yaml | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "openapi.yaml ($actual) ne correspond pas a CONTRACT_VERSION ($expected)" >&2
            exit 1
          fi
      - run: ./mvnw -B -ntp verify

  build-native:
    name: Build natif
    # Sur main, et a la demande (workflow_dispatch) sur n'importe quelle branche.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: >
          ./mvnw -B -ntp verify -Dnative -Dquarkus.native.container-build=true
          -Dquarkus.native.native-image-xmx=5g -DskipTests
