# Configuration de base. Aucun secret ici : les valeurs sensibles viennent de l'environnement.
quarkus.application.name=nautilus-api

# Les interfaces generees n'ont pas de prefixe : le contrat et les clients utilisent /v1. /q/* reste hors /v1.
quarkus.rest.path=/v1

# Build natif : Mandrel Java 21 (le defaut de Quarkus 3.40 est jdk-25), epingle par digest
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-21@sha256:706ec9c658d32cbee0e6d07a51d662539b8779dd0c9eb15c93defc96ad232e23

# Base de donnees : PostgreSQL + PostGIS (Dev Services en dev et en test)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.packages=fr.nautilus

# Migrations Flyway (V<AAAAMMJJHHMM>__<description>.sql)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Documentation OpenAPI exposee par l'application
quarkus.smallrye-openapi.path=/q/openapi

# Authentification : serveur de ressources OIDC (Keycloak local, voir U44).
# En dev, Dev Services demarre un Keycloak jetable.
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.devservices.enabled=false
